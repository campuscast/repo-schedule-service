name: CI

on:
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: schedule-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out schedule service
        uses: actions/checkout@v4
        with:
          path: repo-schedule-service

      - name: Check out pinned shared libraries
        uses: actions/checkout@v4
        with:
          repository: campuscast/repo-shared-libs
          ref: 33b17d3f409c53a9be676bd4448ae015fe700c30
          path: repo-shared-libs

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            repo-shared-libs/package-lock.json
            repo-schedule-service/package-lock.json

      - name: Build shared libraries
        working-directory: repo-shared-libs
        run: |
          npm ci
          npm run build

      - name: Install schedule-service dependencies
        working-directory: repo-schedule-service
        run: npm ci

      - name: Lint
        working-directory: repo-schedule-service
        run: npm run lint

      - name: Build
        working-directory: repo-schedule-service
        run: npm run build

      - name: Unit tests
        working-directory: repo-schedule-service
        run: npm run test:unit

      - name: Property-based tests
        working-directory: repo-schedule-service
        run: npm run test:property

      - name: Build Docker image
        run: docker build --file repo-schedule-service/Dockerfile --tag campuscast/schedule-service:${{ github.sha }} .
